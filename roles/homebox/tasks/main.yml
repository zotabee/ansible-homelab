---
# No recurse: the folder holds .secrets, which stays 0700 with 0600 files.
# HomeBox (regular image) runs as root and owns what it writes in /data.
- name: Create HomeBox Directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0775"
  with_items:
    - "{{ homebox.folder }}"

# HomeBox 0.26.0 refuses to start without HBOX_AUTH_API_KEY_PEPPER of at least
# 32 bytes. It is HMAC-keyed into the stored API key hashes, so it must never
# change: a new pepper makes every API key already issued stop working (logins
# and sessions are not affected). Generated once into <folder>/.secrets, unless
# homebox.api_key_pepper is set.
- name: Generate Persistent HomeBox API Key Pepper
  ansible.builtin.set_fact:
    homebox_api_key_pepper: >-
      {{ homebox.api_key_pepper | default('') or
         lookup('ansible.builtin.password', homebox.folder + '/.secrets/api_key_pepper',
                length=64, chars=['ascii_letters', 'digits']) }}
  no_log: true

- name: Check HomeBox API Key Pepper
  ansible.builtin.assert:
    that: homebox_api_key_pepper | string | length >= 32
    fail_msg: "homebox.api_key_pepper must be at least 32 characters, or HomeBox will not start."
    quiet: true

- name: Restrict HomeBox Secrets
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: "{{ item.state }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ homebox.folder }}/.secrets", state: directory, mode: "0700"}
    - {path: "{{ homebox.folder }}/.secrets/api_key_pepper", state: file, mode: "0600"}
  loop_control:
    label: "{{ item.path | basename }}"
  when: not (homebox.api_key_pepper | default(''))

- name: HomeBox Docker Container
  community.docker.docker_container:
    name: homebox
    image: "ghcr.io/sysadminsmedia/homebox:{{ homebox.tag }}"
    pull: true
    volumes:
      - "{{ homebox.folder }}:/data:rw"
    networks:
      - name: web
        aliases:
          - homebox
    env:
      HBOX_LOG_LEVEL: "info"
      HBOX_LOG_FORMAT: "text"
      HBOX_WEB_MAX_UPLOAD_SIZE: "10"
      HBOX_OPTIONS_TRUST_PROXY: "true"
      HBOX_AUTH_API_KEY_PEPPER: "{{ homebox_api_key_pepper }}"
    restart_policy: unless-stopped
    labels:
      # Traefik
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.homebox.rule: "Host(`{{ homebox.subdomain }}.{{ domain }}`)"
      traefik.http.routers.homebox.entrypoints: "websecure"
      traefik.http.routers.homebox.middlewares: "authelia@docker"
      traefik.http.services.homebox.loadbalancer.server.port: "7745"
      # Homer
      homer.enable: "true"
      homer.name: "HomeBox"
      homer.service: "Tools"
      homer.priority: "25"
      homer.subtitle: "The inventory and organization system built for the Home User!"
      homer.url: "https://{{ homebox.subdomain }}.{{ domain }}"
      homer.logo: "assets/homer-icons/svg/homebox.svg"
      homer.target: "_blank"
